name: veedcast-worker

on:
  schedule:
    - cron: "0 * * * *"   # tiap jam; GitHub bisa menunda beberapa menit
  workflow_dispatch:       # tombol "Run workflow" untuk uji manual

concurrency:
  group: veedcast-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jalankan worker
        run: python -m worker.run --max-seconds 240
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
